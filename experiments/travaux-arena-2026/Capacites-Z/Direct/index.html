<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Turbo-Charge · En direct</title><style>
*{box-sizing:border-box}body{margin:0;background:#101b25;color:#f6f3ea;font:16px system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.wrap{width:min(880px,100%)}header{display:flex;align-items:center;gap:12px;justify-content:space-between}h1{font-size:clamp(23px,4vw,34px);margin:0 0 5px}.badge{border-radius:40px;background:#193a31;color:#a4f3be;padding:7px 13px;font-size:13px;font-weight:700;white-space:nowrap}p{color:#bed0d6;line-height:1.5}.screen{background:#050908;border:2px solid #e9b85b;border-radius:9px;overflow:hidden;aspect-ratio:4/3;box-shadow:0 20px 60px #0007}.screen canvas{image-rendering:pixelated}#screen{width:100%;height:100%}small{color:#9eb0b9;display:block;margin-top:12px;line-height:1.5}#status{font-size:14px;color:#f7d483}a{color:#f7d483}
</style></head><body><main class="wrap"><header><h1>Turbo-Charge Bulldozer</h1><span class="badge">● EN DIRECT</span></header><p>Test en donjon : les huit directions défilent automatiquement en boucle.</p><div class="screen"><div id="screen"></div></div><small id="status">Connexion au moteur…</small><small>Vue seule, sans son. C’est un effet visuel expérimental : déplacement, cible et dégâts ne sont pas encore implémentés.</small></main><script type="module">
import RFB from './core/rfb.js';
const status=document.querySelector('#status');const proto=location.protocol==='https:'?'wss':'ws';const url=proto+'://'+location.host+'/websockify';
try{const rfb=new RFB(document.querySelector('#screen'),url);rfb.viewOnly=true;rfb.scaleViewport=true;rfb.resizeSession=false;rfb.addEventListener('connect',()=>status.textContent='Connecté au moteur PMDO · test en boucle');rfb.addEventListener('disconnect',()=>status.textContent='Connexion interrompue. Actualise la page pour réessayer.');rfb.addEventListener('securityfailure',()=>status.textContent='Connexion au test impossible.');}catch(e){status.textContent='Connexion impossible : '+e.message;}
</script></body></html>
