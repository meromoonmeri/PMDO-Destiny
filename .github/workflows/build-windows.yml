name: Build Windows

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout (no LFS required)
        uses: actions/checkout@v4
        with:
          lfs: false
          submodules: false
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependency
        run: python -m pip install Pillow ijson lupa
      - name: Validate source tree
        run: python tools/run_ci_check.py tools/validate.py
      - name: Check Lost Wood DTEF
        run: python tools/run_ci_check.py tools/tests/test_lost_wood_dtef.py
      - name: Check Lost Wood autotile edges
        run: python tools/run_ci_check.py tools/tests/test_lost_wood_raccords.py
      - name: Check Lost Wood reconstruction
        run: python tools/run_ci_check.py tools/tests/test_lost_wood_reproduction.py
      - name: Check PMUniverse tiles
        run: python tools/run_ci_check.py tools/tests/test_banques_pmu.py
      - name: Check hero and partner knockout rule
        run: python tools/run_ci_check.py tools/tests/test_regle_ko.py
      - name: Check reunion naming and Pelipper flight
        run: python tools/run_ci_check.py tools/tests/test_retrouvailles_roles.py
      - name: Check Lost Wood tutorial and statue assets
        run: python tools/run_ci_check.py tools/tests/test_lostwood_tutoriel.py
      - name: Check Lost Wood river, paths and new ruins
        run: python tools/run_ci_check.py tools/tests/test_lost_wood_refonte.py
      - name: Check safe native city payload and compact copy
        run: python tools/run_ci_check.py tools/tests/test_payload_ville.py
      - name: Check Waterfall Village town02 map and dependencies
        run: python tools/run_ci_check.py tools/tests/test_waterfall_town02.py
      - name: Check Reverie building interiors
        run: python tools/run_ci_check.py tools/test_batiments_interieurs.py
      - name: Check Reverie crossroads and connections
        run: python tools/run_ci_check.py tools/tests/test_carrefour_reverie.py
      - name: Check renamed Reverie resources
        run: python tools/run_ci_check.py tools/tests/test_renommage_reverie.py
      - name: Check Reverie editing map and compiled map
        run: python tools/run_ci_check.py tools/tests/test_reverie_architecture.py
      - name: Check Reverie WIP interiors and thresholds
        run: python tools/run_ci_check.py tools/tests/test_reverie_wip.py
      - name: Check animated water hut and doorway
        run: python tools/run_ci_check.py tools/tests/test_hutte_aquatique.py
      - name: Check E2 destination and exploration return
        run: python tools/run_ci_check.py tools/tests/test_e2_reverie.py
      - name: Check retired guild interiors and recovery maps
        run: python tools/run_ci_check.py tools/tests/test_retrait_guilde.py
      - name: Check daily missions and Reverie boards
        run: python tools/run_ci_check.py tools/tests/test_tableaux_reverie.py
      - name: Check four Reverie districts and five stairs
        run: python tools/run_ci_check.py tools/tests/test_quartiers_reverie.py
      - name: Check local NPCs, independent layers and centre visit
        run: python tools/run_ci_check.py tools/tests/test_habitants_quartiers.py
      - name: Check Reverie guided tour merchant replies
        run: python tools/run_ci_check.py tools/tests/test_visite_marchands.py
      - name: Check automatic Reverie building entrances
        run: python tools/run_ci_check.py tools/tests/test_entrees_reverie.py
      - name: Check editable district layers
        run: python tools/run_ci_check.py tools/tests/test_cartes_edition_reverie.py
      - name: Check independent Reverie tilesheets
        run: python tools/run_ci_check.py tools/tests/test_tilessheets_reverie.py
      - name: Check partner follow inside buildings
        run: python tools/run_ci_check.py tools/tests/test_suivi_interieurs.py
      - name: Check PMU object sheets
        run: python tools/run_ci_check.py tools/tests/test_objets_pmu_natifs.py
      - name: Build and package Destiny
        run: python tools/build_windows.py
      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: PMDO-Destiny-Windows-x64
          path: dist/PMDO-Destiny-Windows-x64.zip
          if-no-files-found: error
