name: Build Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout (no LFS required)
        uses: actions/checkout@v4
        with:
          lfs: false
          submodules: false
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependency
        run: python -m pip install Pillow
      - name: Validate source tree
        run: python tools/validate.py
      - name: Build and package Destiny
        run: python tools/build_windows.py
      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: PMDO-Destiny-Windows-x64
          path: dist/PMDO-Destiny-Windows-x64.zip
          if-no-files-found: error
